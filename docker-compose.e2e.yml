services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${E2E_PORT:-18080}:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/errors:/usr/share/nginx/html/errors:ro
    networks:
      - e2e-backend
    depends_on:
      - ui
      - snippet-service

  ui:
    image: ${UI_IMAGE:-ghcr.io/tp1-2-ingsis/printscript-ui:latest}
    networks:
      - e2e-backend

  snippet-service:
    image: ${SNIPPET_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/snippet-service:latest}
    environment:
      PORT: "8080"
      DB_URL: "jdbc:postgresql://snippets-db:5432/snippets"
      DB_USER: "snippets"
      DB_PASSWORD: "snippets"
      LANGUAGE_SERVICE_URL: "http://language-service:8080"
      PERMISSION_SERVICE_URL: "http://permission-service:8080"
    networks:
      - e2e-backend
    depends_on:
      snippets-db:
        condition: service_healthy
      language-service:
        condition: service_started
      permission-service:
        condition: service_started

  language-service:
    image: ${LANGUAGE_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/language-service:latest}
    environment:
      APP_MODE: "web"
      QUARKUS_REDIS_HOSTS: "redis://localhost:6379"
    networks:
      - e2e-backend

  permission-service:
    image: ${PERMISSION_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/permission-service:latest}
    environment:
      PORT: "8080"
      DB_URL: "jdbc:postgresql://permissions-db:5432/permissions_db"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "postgres"
    networks:
      - e2e-backend
    depends_on:
      permissions-db:
        condition: service_healthy

  snippets-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "snippets"
      POSTGRES_USER: "snippets"
      POSTGRES_PASSWORD: "snippets"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snippets -d snippets"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - e2e-backend

  permissions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "permissions_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d permissions_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - e2e-backend

networks:
  e2e-backend:
    driver: bridge
