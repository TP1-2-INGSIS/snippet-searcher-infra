services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${E2E_PORT:-18080}:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/errors:/usr/share/nginx/html/errors:ro
    networks:
      - e2e-backend
    depends_on:
      - ui
      - snippet-service

  ui:
    image: ${UI_IMAGE:-ghcr.io/tp1-2-ingsis/printscript-ui:latest}
    networks:
      - e2e-backend

  snippet-service:
    image: ${SNIPPET_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/snippet-service:latest}
    environment:
      PORT: "8080"
      DB_URL: "jdbc:postgresql://snippets-db:5432/snippets"
      DB_USER: "snippets"
      DB_PASSWORD: "snippets"
      LANGUAGE_SERVICE_URL: "http://language-service:8080"
      PERMISSION_SERVICE_URL: "http://permission-service:8080"
      AUTH_HEADER_IDENTITY_ENABLED: "true"
      REDIS_URL: "redis://redis:6379"
      ASSETS_SERVICE_URL: "http://assets-service:8080"
      SNIPPET_STORAGE: "assets"
    networks:
      - e2e-backend
    depends_on:
      snippets-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      language-service:
        condition: service_started
      permission-service:
        condition: service_started

  language-service:
    image: ${LANGUAGE_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/language-service:latest}
    environment:
      APP_MODE: "web"
      REDIS_URL: "redis://redis:6379"
    networks:
      - e2e-backend

  language-worker:
    image: ${LANGUAGE_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/language-service:latest}
    environment:
      APP_MODE: "worker"
      REDIS_URL: "redis://redis:6379"
      REDIS_STREAM_CONSUMER: "worker-1"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    networks:
      - e2e-backend
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - e2e-backend

  permission-service:
    image: ${PERMISSION_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/permission-service:latest}
    environment:
      PORT: "8080"
      DB_URL: "jdbc:postgresql://permissions-db:5432/permissions_db"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "postgres"
      USERS_PROVIDER: "none"
    networks:
      - e2e-backend
    depends_on:
      permissions-db:
        condition: service_healthy

  # Assets no se ejercita todavia en el smoke test (lo hara SNIP-4); solo debe levantar.
  assets-service:
    image: ${ASSETS_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/assets:latest}
    environment:
      SPRING_PROFILES_ACTIVE: "default"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://assets-db:5432/assets"
      SPRING_DATASOURCE_USERNAME: "assets"
      SPRING_DATASOURCE_PASSWORD: "assets"
      # Cuenta descartable de Azurite (ver AZURITE_ACCOUNTS en el servicio azurite); clave de prueba, no es un secreto.
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=e2eaccount;AccountKey=ZTJlLWR1bW15LWtleS0wMTIzNDU2Nzg5;BlobEndpoint=http://azurite:10000/e2eaccount;"
      AZURE_STORAGE_CONTAINER: "snippets"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    networks:
      - e2e-backend
    depends_on:
      assets-db:
        condition: service_healthy
      azurite:
        condition: service_started

  assets-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "assets"
      POSTGRES_USER: "assets"
      POSTGRES_PASSWORD: "assets"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assets -d assets"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - e2e-backend

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--loose", "--skipApiVersionCheck", "--inMemoryPersistence"]
    environment:
      AZURITE_ACCOUNTS: "e2eaccount:ZTJlLWR1bW15LWtleS0wMTIzNDU2Nzg5"
    networks:
      - e2e-backend

  snippets-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "snippets"
      POSTGRES_USER: "snippets"
      POSTGRES_PASSWORD: "snippets"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snippets -d snippets"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - e2e-backend

  permissions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "permissions_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d permissions_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - e2e-backend

networks:
  e2e-backend:
    driver: bridge
