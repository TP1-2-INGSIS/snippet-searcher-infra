name: Multi-Service E2E Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Optional live URL (e.g. https://grupo-6-ingsis.duckdns.org). Leave empty to spin up local Docker Compose stack."
        required: false
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v4

      - name: Start 4-service stack with Docker Compose
        if: ${{ inputs.target_url == '' }}
        run: |
          docker compose -f docker-compose.e2e.yml pull
          docker compose -f docker-compose.e2e.yml up -d
          echo "Waiting for gateway & all services to become ready..."
          for i in $(seq 1 60); do
            if curl -fsS -H "X-User-Id: e2e-warmup" http://localhost:18080/api/languages | grep -q "printscript"; then
              echo "Stack ready after ${i} attempts"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.e2e.yml logs --tail=80
          exit 1

      - name: Run 14-step multi-service E2E suite
        env:
          TARGET_URL: ${{ inputs.target_url != '' && inputs.target_url || 'http://localhost:18080' }}
        run: ./scripts/e2e-smoke-test.sh "${TARGET_URL}"

      - name: Dump logs on failure
        if: ${{ failure() && inputs.target_url == '' }}
        run: |
          docker compose -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.e2e.yml logs --tail=120

      - name: Tear down E2E Compose stack
        if: ${{ always() && inputs.target_url == '' }}
        run: docker compose -f docker-compose.e2e.yml down -v
