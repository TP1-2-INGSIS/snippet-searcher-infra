name: Multi-Service E2E Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Optional live URL (e.g. https://grupo-6-ingsis.duckdns.org). Leave empty to spin up local Docker Compose stack."
        required: false
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.target_url == '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull public service images and ensure UI image
        if: ${{ inputs.target_url == '' }}
        run: |
          docker compose -f docker-compose.e2e.yml pull snippet-service language-service permission-service snippets-db permissions-db proxy
          if ! docker pull ghcr.io/tp1-2-ingsis/printscript-ui:latest; then
            echo "GHCR printscript-ui image requires package-level auth; building from public TP1-2-INGSIS/printscript-ui repo..."
            docker build \
              --build-arg VITE_BACKEND_URL=/api \
              --build-arg VITE_AUTH0_DOMAIN=e2e.local \
              --build-arg VITE_AUTH0_CLIENT_ID=e2e-client \
              --build-arg VITE_AUTH0_AUDIENCE=https://e2e.local \
              -t ghcr.io/tp1-2-ingsis/printscript-ui:latest \
              https://github.com/TP1-2-INGSIS/printscript-ui.git#master
          fi

      - name: Start 4-service stack with Docker Compose
        if: ${{ inputs.target_url == '' }}
        run: |
          docker compose -f docker-compose.e2e.yml up -d
          echo "Waiting for gateway & all services to become ready..."
          for i in $(seq 1 60); do
            if curl -fsS -H "X-User-Id: e2e-warmup" http://localhost:18080/api/languages | grep -q "printscript"; then
              echo "Stack ready after ${i} attempts"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.e2e.yml logs --tail=80
          exit 1

      - name: Run 14-step multi-service E2E suite
        env:
          TARGET_URL: ${{ inputs.target_url != '' && inputs.target_url || 'http://localhost:18080' }}
        run: ./scripts/e2e-smoke-test.sh "${TARGET_URL}"

      - name: Dump logs on failure
        if: ${{ failure() && inputs.target_url == '' }}
        run: |
          docker compose -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.e2e.yml logs --tail=120

      - name: Tear down E2E Compose stack
        if: ${{ always() && inputs.target_url == '' }}
        run: docker compose -f docker-compose.e2e.yml down -v
