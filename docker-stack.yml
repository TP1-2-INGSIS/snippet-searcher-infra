version: '3.8'

services:
  proxy:
    image: nginx:1.27-alpine
    networks:
      - backend
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    configs:
      - source: proxy_conf
        target: /etc/nginx/conf.d/default.conf
      - source: error404_page
        target: /usr/share/nginx/html/errors/404.html
      - source: error502_page
        target: /usr/share/nginx/html/errors/502.html
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  ui:
    image: ${UI_IMAGE:-ghcr.io/tp1-2-ingsis/printscript-ui:latest}
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  snippet-service:
    image: ${SNIPPET_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/snippet-service:latest}
    environment:
      PORT: "8080"
      DB_URL: "jdbc:postgresql://snippets-db:5432/snippets"
      DB_USER: "${SNIPPETS_DB_USER:-snippets}"
      DB_PASSWORD: "${SNIPPETS_DB_PASSWORD:-snippets}"
      LANGUAGE_SERVICE_URL: "http://language-service:8080"
      PERMISSION_SERVICE_URL: "http://permission-service:8080"
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  language-service:
    image: ${LANGUAGE_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/language-service:latest}
    environment:
      APP_MODE: "web"
      QUARKUS_REDIS_HOSTS: "redis://localhost:6379"
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  permission-service:
    image: ${PERMISSION_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/permission-service:latest}
    environment:
      PORT: "8080"
      DB_URL: "jdbc:postgresql://permissions-db:5432/permissions_db"
      DB_USERNAME: "${PERMISSIONS_DB_USER:-postgres}"
      DB_PASSWORD: "${PERMISSIONS_DB_PASSWORD:-postgres}"
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  snippets-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "snippets"
      POSTGRES_USER: "${SNIPPETS_DB_USER:-snippets}"
      POSTGRES_PASSWORD: "${SNIPPETS_DB_PASSWORD:-snippets}"
    volumes:
      - snippets_db_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  permissions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "permissions_db"
      POSTGRES_USER: "${PERMISSIONS_DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${PERMISSIONS_DB_PASSWORD:-postgres}"
    volumes:
      - permissions_db_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  backend:
    driver: overlay

volumes:
  certbot_conf:
  certbot_www:
  snippets_db_data:
  permissions_db_data:

configs:
  proxy_conf:
    name: "snippet_searcher_proxy_conf_v1"
    file: ./nginx/conf.d/default.conf
  error404_page:
    name: "snippet_searcher_error404_v1"
    file: ./nginx/errors/404.html
  error502_page:
    name: "snippet_searcher_error502_v1"
    file: ./nginx/errors/502.html
