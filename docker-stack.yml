version: '3.8'

services:
  # ============================================================================
  # 1. Reverse Proxy Ingress (NGINX)
  # Único componente que publica puertos al host / exterior.
  # ============================================================================
  proxy:
    image: nginx:1.27-alpine
    networks:
      - backend
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    configs:
      - source: proxy_conf
        target: /etc/nginx/conf.d/default.conf
      - source: error404_page
        target: /usr/share/nginx/html/errors/404.html
      - source: error502_page
        target: /usr/share/nginx/html/errors/502.html
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ============================================================================
  # 2. Frontend SPA (printscript-ui)
  # Servidor web NGINX interno sirviendo el bundle de React compilado.
  # ============================================================================
  ui:
    image: ${UI_IMAGE:-ghcr.io/tp1-2-ingsis/printscript-ui:latest}
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ============================================================================
  # 3. Core API (snippet-service)
  # Gestiona snippets, tests, reglas de lint/format y orquesta los demás servicios.
  # ============================================================================
  snippet-service:
    image: ${SNIPPET_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/snippet-service:latest}
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ============================================================================
  # 4. Engine & Runners (language-service)
  # Stateless - evalúa sintaxis, linteo, formateo y ejecución de PrintScript.
  # ============================================================================
  language-service:
    image: ${LANGUAGE_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/language-service:latest}
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ============================================================================
  # 5. Seguridad y Permisos (permission-service)
  # Ownership y control de acceso (Read/Write/Share).
  # ============================================================================
  permission-service:
    image: ${PERMISSION_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/permission-service:latest}
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ============================================================================
  # 6. Renovación Automática de Certificados TLS (Certbot)
  # ============================================================================
  certbot:
    image: certbot/certbot:latest
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  backend:
    driver: overlay

volumes:
  certbot_conf:
  certbot_www:

# Swarm Configs (Inmutables por diseño de la cátedra)
# Ante cada cambio en los archivos locales, incrementar el sufijo de versión (v1 -> v2)
configs:
  proxy_conf:
    name: "snippet_searcher_proxy_conf_v1"
    file: ./nginx/conf.d/default.conf
  error404_page:
    name: "snippet_searcher_error404_v1"
    file: ./nginx/errors/404.html
  error502_page:
    name: "snippet_searcher_error502_v1"
    file: ./nginx/errors/502.html
