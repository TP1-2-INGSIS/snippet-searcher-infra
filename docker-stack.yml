services:
  proxy:
    image: nginx:1.27-alpine
    networks:
      - backend
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    configs:
      - source: error404_page
        target: /usr/share/nginx/html/errors/404.html
      - source: error502_page
        target: /usr/share/nginx/html/errors/502.html
    # La config se renderiza al arrancar (HTTP o HTTPS segun haya certificado)
    # y se recarga cada 6 h para tomar los certificados renovados.
    entrypoint: ["/bin/sh", "/nginx-src/entrypoint.sh"]
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./nginx:/nginx-src:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Renueva los certificados Let's Encrypt (webroot compartido con nginx).
  certbot:
    image: certbot/certbot:v5.10.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  ui:
    image: ${UI_IMAGE:-ghcr.io/tp1-2-ingsis/printscript-ui:latest}
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  snippet-service:
    image: ${SNIPPET_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/snippet-service:latest}
    environment:
      PORT: "8080"
      DB_URL: "jdbc:postgresql://snippets-db:5432/snippets"
      DB_USER: "${SNIPPETS_DB_USER:-snippets}"
      DB_PASSWORD: "${SNIPPETS_DB_PASSWORD:-snippets}"
      LANGUAGE_SERVICE_URL: "http://language-service:8080"
      PERMISSION_SERVICE_URL: "http://permission-service:8080"
      AUTH0_ISSUER_URI: "${AUTH0_ISSUER_URI:-}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE:-}"
      AUTH_HEADER_IDENTITY_ENABLED: "false"
      REDIS_URL: "redis://redis:6379"
      ASSETS_SERVICE_URL: "http://assets-service:8080"
      SNIPPET_STORAGE: "assets"
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:-}"
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  language-service:
    image: ${LANGUAGE_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/language-service:latest}
    environment:
      APP_MODE: "web"
      REDIS_URL: "redis://redis:6379"
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:-}"
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  language-worker:
    image: ${LANGUAGE_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/language-service:latest}
    environment:
      APP_MODE: "worker"
      REDIS_URL: "redis://redis:6379"
      # Swarm expande la plantilla al crear cada tarea: worker-1, worker-2, ...
      REDIS_STREAM_CONSUMER: "worker-{{.Task.Slot}}"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:-}"
    networks:
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 768M
      restart_policy:
        condition: any

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any

  permission-service:
    image: ${PERMISSION_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/permission-service:latest}
    environment:
      PORT: "8080"
      DB_URL: "jdbc:postgresql://permissions-db:5432/permissions_db"
      DB_USERNAME: "${PERMISSIONS_DB_USER:-postgres}"
      DB_PASSWORD: "${PERMISSIONS_DB_PASSWORD:-postgres}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:-}"
      AUTH0_MGMT_CLIENT_ID: "${AUTH0_MGMT_CLIENT_ID:-}"
      AUTH0_MGMT_CLIENT_SECRET: "${AUTH0_MGMT_CLIENT_SECRET:-}"
      USERS_PROVIDER: "auth0"
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:-}"
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  assets-service:
    image: ${ASSETS_SERVICE_IMAGE:-ghcr.io/tp1-2-ingsis/assets:latest}
    environment:
      SPRING_PROFILES_ACTIVE: "default"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://assets-db:5432/assets"
      SPRING_DATASOURCE_USERNAME: "${ASSETS_DB_USER:-assets}"
      SPRING_DATASOURCE_PASSWORD: "${ASSETS_DB_PASSWORD:-assets}"
      # Prod: cuenta real de Azure. Dev: apunta al servicio azurite (ver README).
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:-}"
      AZURE_STORAGE_CONTAINER: "${AZURE_STORAGE_CONTAINER:-snippets}"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:-}"
    networks:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: any

  assets-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "assets"
      POSTGRES_USER: "${ASSETS_DB_USER:-assets}"
      POSTGRES_PASSWORD: "${ASSETS_DB_PASSWORD:-assets}"
    volumes:
      - assets_db_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Emulador de Azure Blob. Siempre presente; en prod queda sin uso porque
  # AZURE_STORAGE_CONNECTION_STRING apunta a la cuenta real de Azure.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--loose", "--skipApiVersionCheck", "--location", "/data"]
    volumes:
      - azurite_data:/data
    networks:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any

  snippets-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "snippets"
      POSTGRES_USER: "${SNIPPETS_DB_USER:-snippets}"
      POSTGRES_PASSWORD: "${SNIPPETS_DB_PASSWORD:-snippets}"
    volumes:
      - snippets_db_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  permissions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "permissions_db"
      POSTGRES_USER: "${PERMISSIONS_DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${PERMISSIONS_DB_PASSWORD:-postgres}"
    volumes:
      - permissions_db_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  backend:
    driver: overlay

volumes:
  certbot_conf:
  certbot_www:
  snippets_db_data:
  permissions_db_data:
  redis_data:
  assets_db_data:
  azurite_data:

configs:
  error404_page:
    name: "snippet_searcher_error404_v1"
    file: ./nginx/errors/404.html
  error502_page:
    name: "snippet_searcher_error502_v1"
    file: ./nginx/errors/502.html
