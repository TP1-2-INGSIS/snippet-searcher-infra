<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 - Servicio no disponible | Snippet Searcher</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; max-width: 480px; padding: 2rem; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { font-size: 4rem; margin: 0; color: #f43f5e; }
        h2 { font-size: 1.5rem; margin-top: 0.5rem; }
        p { color: #94a3b8; font-size: 1rem; line-height: 1.5; }
        .retry-btn { display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: #e11d48; color: white; text-decoration: none; border-radius: 6px; font-weight: 500; cursor: pointer; border: none; }
        .retry-btn:hover { background: #be123c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>502</h1>
        <h2>Bad Gateway / Servicio no disponible</h2>
        <p>El reverse proxy no pudo establecer comunicación con el microservicio solicitado. Puede que el contenedor esté iniciando o temporalmente fuera de línea.</p>
        <button class="retry-btn" onclick="window.location.reload()">Reintentar</button>
    </div>
</body>
</html>
