# Soporte para WebSockets (Terminal interactiva / streaming)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost _;

    # 1. Desafío ACME para Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 2. Páginas de error personalizadas
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html/errors;
        internal;
    }

    error_page 502 503 504 /502.html;
    location = /502.html {
        root /usr/share/nginx/html/errors;
        internal;
    }

    # 3. Microservicio de Snippets (Core API & WebSockets)
    # Rutea /api/* hacia snippet-service:8080/*
    location /api/ {
        proxy_pass http://snippet-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Frontend SPA (printscript-ui)
    location / {
        proxy_pass http://ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

